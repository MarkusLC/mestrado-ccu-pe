name: Process SISCAN Data

on:
  schedule:
    - cron: '0 12 15 * *'  # Dia 15 às 12h UTC
  workflow_dispatch:
  push:
    paths:
      - 'data/siscan_*.csv'

permissions:
  contents: write

jobs:
  process-siscan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas -q

      - name: Process TABNET CSV if available
        continue-on-error: true
        run: |
          python3 fetch_tabnet_process.py

      - name: Show current data status
        run: |
          echo "📊 Current SISCAN data files:"
          ls -lh data/siscan_*.json 2>/dev/null || echo "   (No processed data yet)"
          echo ""
          echo "ℹ️  To update with real data:"
          echo "   1. Download CSV from TABNET: https://tabnet.saude.pe.gov.br/"
          echo "   2. Save as: data/siscan_manual.csv"
          echo "   3. Push to repo → GitHub Actions processes automatically"

      - name: Commit if data changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/siscan_*.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: update SISCAN data ($(date -u '+%Y-%m-%d'))" && git push
          )
