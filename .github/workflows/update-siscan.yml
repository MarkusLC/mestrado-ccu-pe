name: Update SISCAN Data

on:
  schedule:
    - cron: '0 12 15 * *'  # Roda todo dia 15 às 12h UTC
  workflow_dispatch:  # Permite trigger manual

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'

      - name: Install R dependencies
        run: |
          install.packages(c('jsonlite', 'dplyr', 'tidyr', 'httr', 'xml2'))
        shell: Rscript {0}

      - name: Fetch SISCAN data
        run: Rscript fetch_siscan.R

      - name: Commit and push if data changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/siscan_*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update SISCAN data" && git push)
