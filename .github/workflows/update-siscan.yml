name: Atualizar dados do SISCAN

# O SISCAN publica com defasagem de semanas e admite lançamento retroativo, então
# uma execução mensal basta. Roda no dia 15 para pegar a competência anterior já
# consolidada.
on:
  schedule:
    - cron: '0 12 15 * *'
  workflow_dispatch:
  push:
    paths:
      - 'pipeline.py'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install --quiet dbfread

      - name: Cache dos dados brutos
        uses: actions/cache@v4
        with:
          path: data/bruto
          key: siscan-bruto-v1
          restore-keys: siscan-bruto-

      - name: Self-check
        run: python3 pipeline.py --check

      - name: Coletar e montar o painel
        run: python3 pipeline.py

      - name: Commitar se os dados mudaram
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/resumo.json data/populacao_pe.json
          if git diff --staged --quiet; then
            echo "Sem mudanças nos dados."
          else
            ULTIMA=$(python3 -c "import json;print(json.load(open('data/resumo.json'))['ultima_competencia'])")
            git commit -m "chore: atualizar dados do SISCAN (até ${ULTIMA})"
            git push
          fi
