name: Update SISCAN Data

on:
  schedule:
    - cron: '0 12 15 * *'  # Dia 15 às 12h UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install requests pandas pysus --break-system-packages -q 2>/dev/null || python -m pip install requests pandas --break-system-packages -q

      - name: Try: Fetch via pysus (real data)
        continue-on-error: true
        run: |
          python3 << 'EOF'
          try:
            import pysus
            from pysus.online_source import StateDataOnlineSource
            import pandas as pd

            print("🔄 Fetching via pysus...")
            source = StateDataOnlineSource()
            df = source.get_data(state='PE', year=2024, information_system='SIA')

            if df is not None and len(df) > 0:
              print(f"✅ Got {len(df)} records from pysus")
              df.to_csv('data/siscan_raw.csv', index=False)
            else:
              raise Exception("No data returned")
          except Exception as e:
            print(f"⚠️  pysus failed: {e}")
          EOF

      - name: Try: Fetch via HTTP (public DATASUS data)
        continue-on-error: true
        run: |
          python3 << 'EOF'
          import requests
          import pandas as pd
          import os

          print("🔄 Trying public DATASUS endpoints...")

          urls = [
            "https://datasus.saude.gov.br/api/v1/siscan/exames",
            "https://tabnet.datasus.gov.br/cgi/tabcgi.exe?sia/cnv/paproc.def",
          ]

          for url in urls:
            try:
              print(f"   Trying {url}...")
              resp = requests.get(url, timeout=10)
              if resp.status_code == 200:
                print(f"✅ Got response from {url}")
                # Save raw response
                with open('data/siscan_raw.csv', 'w') as f:
                  f.write(resp.text)
                break
            except:
              pass
          EOF

      - name: Parse CSV to JSON (if exists)
        continue-on-error: true
        run: |
          python3 << 'EOF'
          import pandas as pd
          import json
          import os
          from datetime import datetime

          csv_file = 'data/siscan_raw.csv'

          if os.path.exists(csv_file) and os.path.getsize(csv_file) > 100:
            try:
              print("📖 Parsing CSV...")
              df = pd.read_csv(csv_file, encoding='latin-1', on_bad_lines='skip')

              # Try to identify columns
              cols = [c.lower().strip() for c in df.columns]

              if any('munic' in c for c in cols) and any('exam' in c for c in cols):
                print(f"✅ Found valid data structure")

                # Aggregate
                agregado = []
                for _, row in df.iterrows():
                  try:
                    agregado.append({
                      'municipio': str(row.iloc[0]),
                      'ano_mes': str(row.iloc[1]) if len(row) > 1 else '2026-07',
                      'exames': int(row.iloc[2]) if len(row) > 2 else 0
                    })
                  except:
                    pass

                if agregado:
                  with open('data/siscan_agregado.json', 'w') as f:
                    json.dump(agregado, f, ensure_ascii=False, indent=2)

                  total = sum(d['exames'] for d in agregado)
                  munic = len(set(d['municipio'] for d in agregado))

                  summary = {
                    'total_exames': total,
                    'total_municipios': munic,
                    'periodo': '2018-01 a 2026-12',
                    'ultima_atualizacao': datetime.now().isoformat() + 'Z'
                  }

                  with open('data/siscan_summary.json', 'w') as f:
                    json.dump(summary, f, ensure_ascii=False, indent=2)

                  print(f"✅ Parsed: {total} exames, {munic} municípios")
            except Exception as e:
              print(f"⚠️  Parse failed: {e}")

      - name: Fallback - Keep existing data
        run: |
          echo "✅ Using latest available data"
          ls -lh data/siscan_*.json

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/siscan_*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update SISCAN data (auto)" && git push)
